<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#05040c" />
  <title>KINDLED</title>
  <style>
:root {
  --bg: #05040c;
  --ink: #f4ead8;
  --gold: #ffc86a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#wrap {
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 50% 30%, #1a1230 0%, #05040c 62%);
}

#game {
  display: block;
  touch-action: none;
  background: #07060e;
  box-shadow:
    0 0 0 1px rgba(255, 200, 120, 0.08),
    0 18px 80px rgba(0, 0, 0, 0.55);
  max-width: 100vw;
  max-height: 100vh;
  max-height: 100dvh;
}

#boot {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #c9b896;
  letter-spacing: 0.35em;
  font-size: 11px;
  text-transform: uppercase;
  pointer-events: none;
  opacity: 0.4;
}

  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="405" height="720"></canvas>
  </div>
  <div id="boot">kindling…</div>
  <script>
/* KINDLED — web slice. Vanilla canvas. TAP pulse / DRAG bank. */
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d", { alpha: false });
  const bootEl = document.getElementById("boot");

  const TAU = Math.PI * 2;
  const SAVE_KEY = "kindled-slice-v1";
  const FIB = [1, 2, 3, 5, 8, 12, 18, 24, 36];
  const TAP_MS = 180;
  const MOVE_PX = 12;
  const WICK_MAX = 3;

  const MOTHS = {
    wickling: {
      id: "wickling", name: "Wickling", rarity: "common",
      nectar: 4, r: 12, hue: 32, sat: 90, light: 58, wobble: 0.85, speed: 150,
      spawnW: 1.0, audio: "soft", mag: 1,
    },
    glasswing: {
      id: "glasswing", name: "Glasswing", rarity: "uncommon",
      nectar: 9, r: 14, hue: 185, sat: 35, light: 78, wobble: 1.45, speed: 198,
      spawnW: 0.28, audio: "glass", pale: true, mag: 0.82,
    },
    skipper: {
      id: "skipper", name: "Reed-Skipper", rarity: "common",
      nectar: 5, r: 10, hue: 92, sat: 70, light: 55, wobble: 2.7, speed: 242,
      spawnW: 0.45, audio: "zip", zigzag: true, mag: 0.78,
    },
    choir: {
      id: "choir", name: "Choir Ember", rarity: "uncommon",
      nectar: 7, r: 9, hue: 8, sat: 85, light: 62, wobble: 1.1, speed: 178,
      spawnW: 0.18, audio: "choir", trio: true, mag: 0.9,
    },
    vault: {
      id: "vault", name: "Vault Moth", rarity: "rare",
      nectar: 18, r: 17, hue: 268, sat: 55, light: 64, wobble: 0.5, speed: 128,
      spawnW: 0.08, audio: "deep", shadow: true, mag: 1.05,
    },
    spark: {
      id: "spark", name: "Spark Mite", rarity: "common",
      nectar: 3, r: 7, hue: 48, sat: 100, light: 68, wobble: 3.3, speed: 268,
      spawnW: 0.35, audio: "tick", mag: 0.7,
    },
  };
  const MOTH_LIST = Object.values(MOTHS);

  const BLESSINGS = [
    { id: "deep", name: "Deep Pulse", sub: "Wider magnet this flight", chip: "pulse radius forever" },
    { id: "twin", name: "Twin Wick", sub: "Echo pulse every 8s", chip: "shorter cooldown forever" },
    { id: "beacon", name: "Roost Beacon", sub: "+25% nectar this flight", chip: "+1 nectar on commons forever" },
  ];

  function defaultSave() {
    return {
      flights: 0, nectar: 0, pulseChip: 0, cdChip: 0, nectChip: 0,
      roost: 1, relics: 0, bestCombo: 0, seenTeach: false,
    };
  }
  let save = defaultSave();
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) save = Object.assign(defaultSave(), JSON.parse(raw));
  } catch (_) {}
  function persist() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {}
  }

  const SFX = {
    ctx: null, master: null, drone: null, muted: false, lastGlass: 0,
    ensure() {
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.22;
      this.master.connect(this.ctx.destination);
    },
    resume() {
      this.ensure();
      if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
      this.startDrone();
    },
    now() { return this.ctx ? this.ctx.currentTime : 0; },
    env(node, a, d, g, t0) {
      const p = node.gain;
      p.cancelScheduledValues(t0);
      p.setValueAtTime(0.0001, t0);
      p.exponentialRampToValueAtTime(g, t0 + a);
      p.exponentialRampToValueAtTime(0.0001, t0 + a + d);
    },
    osc(type, freq, a, d, g, detune) {
      if (!this.ctx || this.muted) return;
      const t0 = this.now();
      const o = this.ctx.createOscillator();
      const gN = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t0);
      if (detune) o.detune.setValueAtTime(detune, t0);
      this.env(gN, a, d, g, t0);
      o.connect(gN); gN.connect(this.master);
      o.start(t0); o.stop(t0 + a + d + 0.02);
      return o;
    },
    noise(a, d, g, hp, lp) {
      if (!this.ctx || this.muted) return;
      const t0 = this.now();
      const n = this.ctx.createBufferSource();
      const len = Math.max(1, Math.floor(this.ctx.sampleRate * (a + d + 0.05)));
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      n.buffer = buf;
      const gN = this.ctx.createGain();
      this.env(gN, a, d, g, t0);
      let node = n;
      if (hp) {
        const f = this.ctx.createBiquadFilter();
        f.type = "highpass"; f.frequency.value = hp;
        node.connect(f); node = f;
      }
      if (lp) {
        const f = this.ctx.createBiquadFilter();
        f.type = "lowpass"; f.frequency.value = lp;
        node.connect(f); node = f;
      }
      node.connect(gN); gN.connect(this.master);
      n.start(t0); n.stop(t0 + a + d + 0.02);
    },
    pulse() {
      this.noise(0.02, 0.22, 0.38, 180, 1400);
      this.osc("sine", 90, 0.01, 0.28, 0.45);
      const o = this.osc("triangle", 220, 0.01, 0.18, 0.18);
      if (o && this.ctx) o.frequency.exponentialRampToValueAtTime(140, this.now() + 0.18);
    },
    catchSpark(comboStep) {
      const base = 520 + comboStep * 38;
      this.osc("sine", base, 0.005, 0.12, 0.28);
      this.osc("triangle", base * 1.5, 0.008, 0.16, 0.16);
      this.osc("sine", base * 2.0, 0.01, 0.1, 0.08);
    },
    comboStinger(n) {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      const i = Math.min(notes.length - 1, Math.max(0, n - 2));
      this.osc("triangle", notes[i], 0.01, 0.22, 0.22);
      this.osc("sine", notes[i] * 0.5, 0.01, 0.3, 0.12);
      if (n >= 5) this.osc("sine", notes[i] * 2, 0.01, 0.18, 0.1);
    },
    nearMiss() {
      this.osc("sine", 880, 0.005, 0.09, 0.12);
      this.osc("triangle", 1320, 0.005, 0.08, 0.06);
    },
    glass() {
      const t = performance.now();
      if (t - this.lastGlass < 420) return;
      this.lastGlass = t;
      this.osc("sine", 1480, 0.02, 0.35, 0.07);
      this.osc("sine", 1760, 0.03, 0.4, 0.05, 8);
    },
    hit() {
      this.noise(0.01, 0.28, 0.5, 80, 700);
      this.osc("sawtooth", 70, 0.008, 0.32, 0.28);
      this.osc("sine", 140, 0.01, 0.22, 0.18);
    },
    burn() {
      this.noise(0.01, 0.16, 0.28, 400, 2200);
      this.osc("triangle", 320, 0.005, 0.14, 0.16);
    },
    land() {
      const t0 = this.now();
      [196, 246.94, 311.13, 392].forEach((f, i) => {
        if (!this.ctx || this.muted) return;
        const o = this.ctx.createOscillator();
        const gN = this.ctx.createGain();
        o.type = "sine";
        o.frequency.value = f;
        const t = t0 + i * 0.07;
        this.env(gN, 0.02, 0.7, 0.16, t);
        o.connect(gN); gN.connect(this.master);
        o.start(t); o.stop(t + 0.85);
      });
    },
    crashLand() {
      this.noise(0.02, 0.45, 0.32, 60, 500);
      this.osc("sine", 90, 0.02, 0.5, 0.22);
      this.land();
    },
    relic() {
      this.osc("sine", 392, 0.02, 0.5, 0.18);
      this.osc("triangle", 784, 0.04, 0.55, 0.12);
      this.osc("sine", 1176, 0.06, 0.4, 0.08);
    },
    ui() { this.osc("sine", 440, 0.005, 0.08, 0.1); },
    startDrone() {
      if (!this.ctx || this.drone) return;
      const make = (freq, type, g, detune) => {
        const o = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const lfo = this.ctx.createOscillator();
        const lfoG = this.ctx.createGain();
        o.type = type; o.frequency.value = freq;
        if (detune) o.detune.value = detune;
        gain.gain.value = g;
        lfo.frequency.value = 0.07 + Math.random() * 0.05;
        lfoG.gain.value = freq * 0.012;
        lfo.connect(lfoG); lfoG.connect(o.frequency);
        o.connect(gain); gain.connect(this.master);
        o.start(); lfo.start();
        return { o, gain, lfo };
      };
      this.drone = [make(55, "sine", 0.07, 0), make(82.4, "triangle", 0.035, -6), make(110, "sine", 0.02, 4)];
    },
  };

  function vibe(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (_) {}
  }

  let W = 405, H = 720, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const vw = window.innerWidth, vh = window.innerHeight, aspect = 9 / 16;
    let cssW, cssH;
    if (vw / vh > aspect) { cssH = vh; cssW = vh * aspect; }
    else { cssW = vw; cssH = vw / aspect; }
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = cssW; H = cssH;
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 80));
  resize();

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const smoothstep = (t) => t * t * (3 - 2 * t);
  function hsl(h, s, l, a) {
    return a == null ? `hsl(${h},${s}%,${l}%)` : `hsla(${h},${s}%,${l}%,${a})`;
  }
  function toLocal(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return { x: ((clientX - rect.left) / rect.width) * W, y: ((clientY - rect.top) / rect.height) * H };
  }

  const parts = [];
  function burst(x, y, n, opt) {
    const hue = opt.hue == null ? 40 : opt.hue;
    const speed = opt.speed || 90;
    const life = opt.life || 0.55;
    const size = opt.size || 2.4;
    const into = opt.into || null;
    for (let i = 0; i < n; i++) {
      const ang = opt.ang != null ? opt.ang + rand(-0.4, 0.4) : rand(0, TAU);
      const sp = speed * rand(0.3, 1.15);
      parts.push({
        x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life, max: life, r: size * rand(0.5, 1.4),
        hue: hue + rand(-12, 12), sat: opt.sat == null ? 90 : opt.sat,
        light: opt.light == null ? 62 : opt.light,
        drag: opt.drag == null ? 0.92 : opt.drag, g: opt.g || 0, into,
        streak: !!opt.streak, ember: !!opt.ember, smoke: !!opt.smoke,
      });
    }
  }
  function updateParts(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      if (p.into) { p.vx += (p.into.x - p.x) * 6 * dt; p.vy += (p.into.y - p.y) * 6 * dt; }
      p.vx *= Math.pow(p.drag, dt * 60);
      p.vy *= Math.pow(p.drag, dt * 60);
      p.vy += p.g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
  }
  function drawParts() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const p of parts) {
      const a = Math.max(0, p.life / p.max);
      if (p.smoke) {
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = `rgba(28,22,32,${a * 0.35})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.2 + (1 - a) * 2.2), 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = "lighter";
        continue;
      }
      ctx.fillStyle = hsl(p.hue, p.sat, p.light, a);
      if (p.streak) {
        ctx.beginPath(); ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.045, p.y - p.vy * 0.045);
        ctx.lineWidth = p.r; ctx.strokeStyle = hsl(p.hue, p.sat, p.light, a * 0.85); ctx.stroke();
      }
      ctx.beginPath();
      if (p.ember) ctx.ellipse(p.x, p.y, p.r * 0.45, p.r * (0.9 + a * 0.8), 0, 0, TAU);
      else ctx.arc(p.x, p.y, p.r * (0.6 + a * 0.6), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  const floats = [];
  function floatText(x, y, text, opt) {
    floats.push({ x, y, text, life: opt.life || 0.9, max: opt.life || 0.9, hue: opt.hue || 42, size: opt.size || 16, vy: opt.vy == null ? -48 : opt.vy });
  }
  function updateFloats(dt) {
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i]; f.life -= dt; f.y += f.vy * dt; f.vy *= 0.96;
      if (f.life <= 0) floats.splice(i, 1);
    }
  }
  function drawFloats() {
    for (const f of floats) {
      const a = clamp(f.life / f.max, 0, 1);
      ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = hsl(f.hue, 80, 72);
      ctx.font = `600 ${f.size}px Palatino Linotype, Georgia, serif`;
      ctx.textAlign = "center"; ctx.shadowColor = hsl(f.hue, 90, 50, 0.6); ctx.shadowBlur = 12;
      ctx.fillText(f.text, f.x, f.y); ctx.restore();
    }
  }

  const stars = [];
  function seedStars() {
    stars.length = 0;
    for (let i = 0; i < 140; i++) {
      stars.push({ x: Math.random(), y: Math.random(), r: rand(0.35, 1.85), tw: rand(0, TAU), sp: rand(0.35, 1.9), a: rand(0.22, 0.95), layer: Math.random() < 0.4 ? 0 : 1, cross: Math.random() < 0.08 });
    }
  }
  seedStars();
  function noise1(x) {
    const s = Math.sin(x * 1.7) * 12.9898 + Math.cos(x * 0.83) * 78.233;
    return s - Math.floor(s);
  }
  function fbm(x) {
    return noise1(x) * 0.5 + noise1(x * 2.1) * 0.28 + noise1(x * 4.3) * 0.15 + noise1(x * 8.1) * 0.07;
  }

  const STATE = { TITLE: "title", FLY: "fly", LAND: "land", ROOST: "roost" };
  let state = STATE.TITLE, time = 0, titleT = 0;
  const run = {
    t: 0, dur: 60, nectar: 0, combo: 0, comboT: 0, bestCombo: 0, kindledT: 0,
    catches: 0, nearMisses: 0, blessing: null, echoT: -99, echoArmed: false,
    alcoveGot: false, teachTap: true, teachHold: true,
    wick: WICK_MAX, invuln: 0, crashed: false, shake: 0, hitFlash: 0, skimT: 0,
  };
  const lantern = { x: 0.5, y: 0.70, vx: 0, bank: 0, bankVis: 0, bankV: 0, roll: 0, pulseT: 99, pulseCd: 0, glow: 1, trail: [], flame: 1 };
  const moths = [], threats = [], speedLines = [], pulseRings = [];
  let spawnAcc = 0, threatAcc = 0, worldZ = 0, fogT = 0;
  let comboPop = 0, comboPopN = 0, landT = 0, roostT = 0;
  let cards = [], picked = -1, hoverCard = -1, titlePulse = 0, lastCatchName = "", lastCatchT = 0;

  function heat() { return clamp(run.t / Math.max(8, run.dur * 0.92), 0, 1); }
  function magScale() { return lerp(1.12, 0.68, smoothstep(heat())); }
  function pulseRadiusPx() {
    const u = Math.min(W, H);
    let r = 0.168 * u * (1 + save.pulseChip * 0.02);
    if (run.blessing === "deep") r *= 1.35;
    if (run.kindledT > 0) r *= 1.18;
    return r * magScale();
  }
  function pulseCdMax() { return Math.max(0.40, 0.55 - save.cdChip * 0.02); }
  function maxBankOff() { return W * 0.34; }
  function lanternPx() { return { x: W * 0.5 + clamp(lantern.bankVis, -1, 1) * maxBankOff(), y: H * lantern.y }; }
  function xToBank(px) { return clamp((px - W * 0.5) / maxBankOff(), -1, 1); }
  function fibStep(combo) { return combo <= 0 ? 0 : FIB[Math.min(FIB.length - 1, combo - 1)]; }

  function resetRun() {
    run.t = 0; run.dur = rand(48, 86); run.nectar = 0; run.combo = 0; run.comboT = 0;
    run.bestCombo = 0; run.kindledT = 0; run.catches = 0; run.nearMisses = 0;
    run.echoT = -99; run.echoArmed = run.blessing === "twin"; run.alcoveGot = false;
    run.teachTap = save.flights < 2; run.teachHold = save.flights < 2;
    run.wick = WICK_MAX; run.invuln = 0; run.crashed = false; run.shake = 0; run.hitFlash = 0; run.skimT = 0;
    moths.length = 0; threats.length = 0; pulseRings.length = 0;
    lantern.bank = 0; lantern.bankVis = 0; lantern.bankV = 0; lantern.roll = 0;
    lantern.pulseT = 99; lantern.pulseCd = 0; lantern.glow = 1; lantern.flame = 1; lantern.trail = [];
    spawnAcc = 0.2; threatAcc = 4.5; worldZ = 0; comboPop = 0; lastCatchName = "";
    const lp = lanternPx();
    const t1 = spawnMoth(MOTHS.wickling, lp.x + rand(-24, 24), H * 0.52, 0); t1.life = 3.6;
    const t2 = spawnMoth(MOTHS.wickling, lp.x + 56, H * 0.40, 0.2); t2.life = 3.4;
    spawnMoth(MOTHS.wickling, lp.x - 48, H * 0.28, 0.45);
  }

  function spawnMoth(def, x, y, delay) {
    const h = heat();
    const m = {
      def, x, y, vx: rand(-12, 12), vy: def.speed * lerp(0.82, 1.28, h) * rand(0.78, 1.16),
      age: -(delay || 0), life: lerp(2.7, 1.85, h), fade: 0.75, phase: rand(0, TAU),
      magnet: false, magSp: 0, rot: rand(0, TAU), caught: false, stretch: 1, alive: true, cue: false,
      magMul: (def.mag || 1) * magScale(),
    };
    moths.push(m); return m;
  }

  function spawnWeighted(x, y) {
    const t = heat();
    const pool = MOTH_LIST.map((d) => {
      let w = d.spawnW;
      if (d.id === "wickling") w *= lerp(1.55, 0.45, t);
      if (d.id === "spark") w *= lerp(0.7, 1.15, t);
      if (d.id === "skipper") w *= lerp(0.25, 1.55, t);
      if (d.id === "glasswing") w *= lerp(0.08, 1.7, t);
      if (d.id === "vault") w *= t < 0.32 ? 0.12 : lerp(0.4, 1.2, t);
      if (d.id === "choir") w *= t < 0.12 ? 0.25 : lerp(0.6, 1.25, t);
      return { d, w };
    });
    let sum = 0; for (const p of pool) sum += p.w;
    let r = Math.random() * sum, def = MOTHS.wickling;
    for (const p of pool) { r -= p.w; if (r <= 0) { def = p.d; break; } }
    if (def.trio) {
      spawnMoth(def, x, y, 0); spawnMoth(def, x - 28, y - 22, 0.05); spawnMoth(def, x + 28, y - 18, 0.1);
    } else if (t > 0.62 && Math.random() < 0.28 + t * 0.25) {
      const n = 2 + ((Math.random() * 3) | 0);
      for (let i = 0; i < n; i++) spawnMoth(def, x + rand(-46, 46), y - i * 22, i * 0.04);
    } else spawnMoth(def, x, y, 0);
  }

  function spawnThreat() {
    const h = heat();
    const kind = Math.random() > 0.32 + h * 0.28 ? "cinder" : "ashbat";
    threats.push({

      const s = Math.round(Math.max(22, W * 0.06) + comboPop * 14 + Math.min(run.combo, 10));
      ctx.font = `700 ${s}px Palatino Linotype, Georgia, serif`;
      ctx.fillStyle = run.kindledT > 0 ? "rgba(255,210,120,0.95)" : "rgba(255,236,210,0.92)";
      ctx.fillText(String(fibStep(run.combo)), W / 2, wickY + 52);
      ctx.font = `600 ${Math.round(Math.max(11, W * 0.03))}px Palatino Linotype, Georgia, serif`;
      ctx.fillStyle = "rgba(255,236,210,0.55)";
      ctx.fillText(run.kindledT > 0 ? "kindled" : "combo", W / 2, wickY + 68);
    }
    if (lastCatchT > 0) {
      ctx.globalAlpha = clamp(lastCatchT * 1.4, 0, 1);
      ctx.font = `italic ${Math.round(Math.max(12, W * 0.032))}px Palatino Linotype, Georgia, serif`;
      ctx.fillStyle = "rgba(255,220,170,0.85)"; ctx.fillText(lastCatchName, W / 2, wickY + 86); ctx.globalAlpha = 1;
    }
    const cd = lantern.pulseCd / pulseCdMax();
    ctx.textAlign = "right";
    ctx.font = `600 ${Math.round(Math.max(10, W * 0.028))}px Palatino Linotype, Georgia, serif`;
    ctx.fillStyle = "rgba(255,236,210,0.4)"; ctx.fillText("pulse", W - pad, H - 28);
    ctx.strokeStyle = "rgba(255,200,120,0.35)"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(W - pad - 10, H - 46, 8, 0, TAU); ctx.stroke();
    ctx.strokeStyle = "rgba(255,200,120,0.95)";
    ctx.beginPath(); ctx.arc(W - pad - 10, H - 46, 8, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - cd)); ctx.stroke();
    ctx.restore();
  }

  function drawTitle() {
    ctx.save(); ctx.globalAlpha = clamp((titleT - 0.2) / 0.8, 0, 1);
    ctx.textAlign = "center"; ctx.fillStyle = "#f4ead8";
    ctx.shadowColor = "rgba(255,160,60,0.35)"; ctx.shadowBlur = 24;
    ctx.font = `600 ${Math.round(W * 0.13)}px Palatino Linotype, Georgia, serif`;
    ctx.fillText("KINDLED", W / 2, H * 0.28); ctx.shadowBlur = 0;
    ctx.font = "italic 13px Palatino Linotype, Georgia, serif";
    ctx.fillStyle = "rgba(244,234,216,0.45)"; ctx.fillText("working title", W / 2, H * 0.28 + 22);
    ctx.font = "14px Palatino Linotype, Georgia, serif";
    ctx.fillStyle = `rgba(244,234,216,${0.4 + 0.3 * Math.sin(titlePulse * 2.4)})`;
    ctx.fillText("tap to fly", W / 2, H * 0.88);
    ctx.font = "11px Palatino Linotype, Georgia, serif"; ctx.fillStyle = "rgba(244,234,216,0.32)";
    ctx.fillText("TAP pulse  ·  DRAG to bank", W / 2, H * 0.91);
    if (save.flights > 0) ctx.fillText(`roost lv ${save.roost}   nectar ${save.nectar}`, W / 2, H * 0.945);
    ctx.restore();
  }

  function wrapText(text, x, y, maxW, lh) {
    const words = text.split(" "); let line = "", yy = y;
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxW) { ctx.fillText(line, x, yy); line = w; yy += lh; }
      else line = test;
    }
    ctx.fillText(line, x, yy);
  }

  function drawRoost() {
    const grow = save.roost, cx = W * 0.5, baseY = H * 0.52;
    ctx.save();
    const vg = ctx.createRadialGradient(cx, H * 0.42, 20, cx, H * 0.42, H * 0.7);
    vg.addColorStop(0, "rgba(40,24,16,0.15)"); vg.addColorStop(1, "rgba(4,3,10,0.55)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H); ctx.restore();
    ctx.save(); ctx.translate(cx, baseY);
    ctx.fillStyle = "#2a1a12"; ctx.beginPath();
    ctx.moveTo(-10 - grow, 80); ctx.quadraticCurveTo(-4, 20, -8, -40 - grow * 6);
    ctx.lineTo(8, -40 - grow * 6); ctx.quadraticCurveTo(4, 20, 10 + grow, 80); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 5 + grow; i++) {
      const ang = -1.4 + i * 0.35, len = 40 + grow * 5 + (i % 3) * 8;
      const x = Math.cos(ang) * len * 0.4, y = -50 - grow * 5 + Math.sin(ang) * 8;
      const rad = 22 + grow * 2 + (i % 2) * 8;
      const g = ctx.createRadialGradient(x, y, 2, x, y, rad);
      g.addColorStop(0, `rgba(255,170,70,${0.12 + grow * 0.02})`); g.addColorStop(1, "rgba(80,40,10,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
    }
    const nLan = Math.min(8, 2 + grow);
    for (let i = 0; i < nLan; i++) {
      const x = -50 + i * (100 / Math.max(1, nLan - 1)), y = -10 + Math.sin(i * 1.7 + roostT) * 4;
      ctx.strokeStyle = "rgba(200,160,90,0.35)"; ctx.beginPath(); ctx.moveTo(x * 0.3, -40); ctx.lineTo(x, y); ctx.stroke();
      ctx.fillStyle = `rgba(255,190,80,${0.45 + 0.2 * Math.sin(roostT * 3 + i)})`;
      ctx.beginPath(); ctx.arc(x, y + 6, 4 + (i === 0 ? 2 : 0), 0, TAU); ctx.fill();
    }
    ctx.restore();
    ctx.save(); ctx.textAlign = "center"; ctx.fillStyle = "#f4ead8";
    ctx.font = "600 22px Palatino Linotype, Georgia, serif"; ctx.globalAlpha = clamp(roostT, 0, 1);
    ctx.fillText("roost", W / 2, H * 0.12);
    ctx.font = "13px Palatino Linotype, Georgia, serif"; ctx.fillStyle = "rgba(244,234,216,0.55)";
    ctx.fillText(`${run.crashed ? "crash land  ·  wick spent" : "home"}   ·   +${run.nectar} nectar   ·   best ${fibStep(run.bestCombo) || run.bestCombo}`, W / 2, H * 0.16);
    if (run.alcoveGot) { ctx.fillStyle = "rgba(255,210,120,0.7)"; ctx.fillText("a relic woke in the alcove", W / 2, H * 0.195); }
    cards.forEach((c, i) => {
      const sel = picked === i, hov = hoverCard === i, y = c.y + (sel ? -8 : 0);
      ctx.globalAlpha = clamp(roostT - 0.15 * i, 0, 1);
      ctx.fillStyle = sel ? "rgba(60,40,20,0.85)" : "rgba(20,16,32,0.72)";
      ctx.strokeStyle = sel || hov ? "rgba(255,200,120,0.7)" : "rgba(255,200,120,0.28)";
      ctx.lineWidth = sel ? 2 : 1; ctx.beginPath(); ctx.roundRect(c.x, y, c.w, c.h, 10); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#f4ead8"; ctx.font = "600 13px Palatino Linotype, Georgia, serif"; ctx.textAlign = "center";
      wrapText(c.name, c.x + c.w / 2, y + 28, c.w - 12, 16);
      ctx.font = "11px Palatino Linotype, Georgia, serif"; ctx.fillStyle = "rgba(244,234,216,0.6)";
      wrapText(c.sub, c.x + c.w / 2, y + 58, c.w - 14, 14);
      ctx.fillStyle = "rgba(255,196,110,0.55)"; ctx.font = "italic 10px Palatino Linotype, Georgia, serif";
      wrapText("chip: " + c.chip, c.x + c.w / 2, y + c.h - 28, c.w - 12, 12);
    });
    if (picked >= 0) {
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(roostT * 3); ctx.fillStyle = "#f4ead8";
      ctx.font = "600 16px Palatino Linotype, Georgia, serif"; ctx.fillText("fly again", W / 2, H * 0.88);
      ctx.font = "11px Palatino Linotype, Georgia, serif"; ctx.fillStyle = "rgba(244,234,216,0.4)";
      ctx.fillText("unlimited  ·  no energy", W / 2, H * 0.91);
    } else {
      ctx.globalAlpha = 0.55; ctx.fillStyle = "rgba(244,234,216,0.5)";
      ctx.font = "12px Palatino Linotype, Georgia, serif"; ctx.fillText("pick a blessing", W / 2, H * 0.88);
    }
    ctx.restore();
  }

  function drawLandFlash() {
    const a = clamp(1 - landT / 1.2, 0, 1);
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = run.crashed ? `rgba(255,90,50,${a * 0.2})` : `rgba(255,180,80,${a * 0.18})`;
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.fillStyle = `rgba(255,236,210,${a})`;
    ctx.font = "600 28px Palatino Linotype, Georgia, serif";
    ctx.fillText(run.crashed ? "crash land" : "home", W / 2, H * 0.4);
    ctx.font = "13px Palatino Linotype, Georgia, serif"; ctx.fillStyle = `rgba(255,236,210,${a * 0.6})`;
    ctx.fillText(run.crashed ? "the wick guttered  ·  roost waits" : "the canyon exhales", W / 2, H * 0.44);
    ctx.restore();
  }

  function applyCamera(fn) {
    ctx.save();
    const sh = run.shake * 7;
    ctx.translate(W / 2 + (Math.random() - 0.5) * sh * 2, H / 2 + (Math.random() - 0.5) * sh);
    ctx.rotate(lantern.roll * 0.35);
    const zoom = 1 + (run.kindledT > 0 ? 0.02 : 0) + run.skimT * 0.04;
    ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2); fn(); ctx.restore();
  }
  function frame() {
    applyCamera(() => {
      drawWorld();
      if (state === STATE.FLY || state === STATE.LAND || state === STATE.TITLE) {
        for (const th of threats) drawThreat(th);
        for (const m of moths) drawMoth(m);
        drawPulseRings(); drawParts(); drawLantern(); drawFloats();
      }
    });
    if (run.hitFlash > 0) { ctx.fillStyle = `rgba(120,20,10,${run.hitFlash * 0.28})`; ctx.fillRect(0, 0, W, H); }
    if (state === STATE.TITLE) drawTitle();
    if (state === STATE.FLY) { drawGlyphs(); drawHUD(); }
    if (state === STATE.LAND) { drawHUD(); drawLandFlash(); }
    if (state === STATE.ROOST) { drawRoost(); drawParts(); }
  }

  let last = performance.now();
  function tick(now) {
    let dt = (now - last) / 1000; last = now; if (dt > 0.05) dt = 0.05; time += dt;
    if (state === STATE.TITLE) updateTitle(dt);
    else if (state === STATE.FLY) updateFly(dt);
    else if (state === STATE.LAND) updateLand(dt);
    else if (state === STATE.ROOST) updateRoost(dt);
    updateParts(dt); updateFloats(dt); frame();
    requestAnimationFrame(tick);
  }
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      this.moveTo(x + rr, y); this.arcTo(x + w, y, x + w, y + h, rr);
      this.arcTo(x + w, y + h, x, y + h, rr); this.arcTo(x, y + h, x, y, rr);
      this.arcTo(x, y, x + w, y, rr); this.closePath(); return this;
    };
  }
  if (bootEl) bootEl.remove();
  requestAnimationFrame(tick);
})();

  </script>
</body>
