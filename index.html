<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0c10" />
  <title>KINDLED — Night Canyon</title>
  <style>
    :root { --bg:#0b0c10; --ink:#e8eaed; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body {
      height:100%; width:100%; overflow:hidden; background:var(--bg); color:var(--ink);
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action:none; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
    }
    #wrap {
      width:100vw; height:100vh; height:100dvh;
      display:flex; align-items:center; justify-content:center;
      background:#0b0c10;
    }
    #game {
      display:block; touch-action:none; background:#0b0c10;
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 12px 40px rgba(0,0,0,.45);
      max-width:100vw; max-height:100vh; max-height:100dvh;
    }
    #boot {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      color:#9aa0a6; font-size:13px;
      pointer-events:none;
    }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="game" width="405" height="720"></canvas></div>
  <div id="boot">Loading</div>
  <script src="game.js"></script>
</body>
</html>
